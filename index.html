<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeuroView</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #060610;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }

    canvas#bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* ── Upload view ── */
    #upload-view {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .upload-box {
      position: relative;
      width: 520px;
      height: 380px;
      background: rgba(10, 12, 40, 0.55);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 24px;
      border: 1.5px solid rgba(80, 180, 255, 0.25);
      box-shadow: 0 0 60px rgba(50,130,255,0.08), 0 0 120px rgba(140,60,255,0.06), inset 0 0 40px rgba(80,160,255,0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      cursor: pointer;
      transition: border-color 0.3s, box-shadow 0.3s, transform 0.2s;
      user-select: none;
    }

    .upload-box:hover {
      border-color: rgba(100,200,255,0.55);
      box-shadow: 0 0 80px rgba(50,130,255,0.18), 0 0 160px rgba(140,60,255,0.12), inset 0 0 40px rgba(80,160,255,0.08);
      transform: scale(1.012);
    }

    .upload-box.drag-over {
      border-color: rgba(120,220,255,0.85);
      box-shadow: 0 0 100px rgba(50,180,255,0.3), 0 0 200px rgba(140,60,255,0.2);
    }

    .upload-box::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 26px;
      border: 1.5px dashed rgba(80,180,255,0.18);
      animation: spin-ring 18s linear infinite;
    }

    @keyframes spin-ring { to { transform: rotate(360deg); } }

    .scan-icon {
      width: 72px; height: 72px; opacity: 0.85;
      filter: drop-shadow(0 0 12px rgba(80,180,255,0.6));
      animation: pulse-icon 3s ease-in-out infinite;
    }

    @keyframes pulse-icon {
      0%,100% { filter: drop-shadow(0 0 12px rgba(80,180,255,0.6)); }
      50%      { filter: drop-shadow(0 0 24px rgba(140,100,255,0.9)); }
    }

    .upload-label { font-size: 1.15rem; font-weight: 500; color: rgba(180,220,255,0.9); letter-spacing: 0.03em; }
    .upload-sub   { font-size: 0.8rem; color: rgba(120,160,220,0.55); letter-spacing: 0.05em; }
    input[type="file"] { display: none; }

    /* ── Viewer view ── */
    #viewer-view {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      flex-direction: column;
    }

    #viewer-view.active { display: flex; }

    #viewer-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background: rgba(6,6,20,0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(80,180,255,0.12);
      flex-shrink: 0;
      gap: 16px;
    }

    #viewer-filename { font-size: 0.8rem; color: rgba(120,180,255,0.65); letter-spacing: 0.08em; flex: 1; }

    /* pipeline steps */
    .pipeline-steps { display: flex; gap: 8px; align-items: center; }

    .step {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      color: rgba(100,140,200,0.45);
      transition: color 0.3s;
    }

    .step.active  { color: rgba(80,200,255,0.9); }
    .step.done    { color: rgba(80,220,160,0.8); }
    .step.error   { color: rgba(255,100,100,0.8); }

    .step-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    .step.active .step-dot { animation: blink 0.8s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    #new-scan-btn {
      background: rgba(80,180,255,0.1);
      border: 1px solid rgba(80,180,255,0.3);
      color: rgba(140,200,255,0.85);
      padding: 5px 14px;
      border-radius: 8px;
      font-size: 0.78rem;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: background 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }

    #new-scan-btn:hover { background: rgba(80,180,255,0.2); border-color: rgba(80,180,255,0.6); }

    /* split layout */
    #viewer-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #scan-panel {
      flex: 1;
      position: relative;
      min-width: 0;
    }

    #niivue-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* analysis panel */
    #analysis-panel {
      width: 360px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: rgba(6,8,24,0.75);
      backdrop-filter: blur(16px);
      border-left: 1px solid rgba(80,180,255,0.1);
    }

    #analysis-header {
      padding: 14px 18px 10px;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      color: rgba(80,180,255,0.5);
      text-transform: uppercase;
      border-bottom: 1px solid rgba(80,180,255,0.07);
      flex-shrink: 0;
    }

    #analysis-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
      scrollbar-width: thin;
      scrollbar-color: rgba(80,180,255,0.2) transparent;
    }

    #analysis-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 10px;
      color: rgba(80,120,180,0.35);
      font-size: 0.8rem;
      text-align: center;
    }

    #analysis-text {
      display: none;
      font-size: 0.82rem;
      line-height: 1.7;
      color: rgba(180,210,255,0.8);
      white-space: pre-wrap;
    }

    #analysis-text .section-title {
      display: block;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(80,180,255,0.7);
      margin-top: 18px;
      margin-bottom: 6px;
    }

    /* loading overlay */
    #loading {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      align-items: center;
      justify-content: center;
      background: rgba(6,6,16,0.75);
      backdrop-filter: blur(6px);
      flex-direction: column;
      gap: 16px;
    }

    #loading.active { display: flex; }

    .spinner {
      width: 44px; height: 44px;
      border: 2px solid rgba(80,180,255,0.15);
      border-top-color: rgba(80,180,255,0.85);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 0.82rem; color: rgba(120,180,255,0.65); letter-spacing: 0.08em; }
  </style>
</head>
<body>

<canvas id="bg"></canvas>

<!-- Upload view -->
<div id="upload-view">
  <div class="upload-box" id="uploadBox">
    <svg class="scan-icon" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="36" cy="36" r="32" stroke="rgba(80,180,255,0.5)" stroke-width="1.5"/>
      <path d="M24 34c0-6.627 5.373-10 12-10s12 3.373 12 10c0 2-.5 4-1.5 5.5C48 42 48 44 46 46c-1 1-2.5 1.5-4 1l-1 3h-10l-1-3c-1.5.5-3 0-4-1-2-2-2-4-.5-6.5C24.5 38 24 36 24 34Z"
            stroke="rgba(120,200,255,0.85)" stroke-width="1.5" fill="rgba(80,140,255,0.08)"/>
      <line x1="30" y1="34" x2="36" y2="30" stroke="rgba(160,220,255,0.5)" stroke-width="1"/>
      <line x1="36" y1="30" x2="42" y2="34" stroke="rgba(160,220,255,0.5)" stroke-width="1"/>
      <line x1="30" y1="34" x2="36" y2="38" stroke="rgba(160,220,255,0.5)" stroke-width="1"/>
      <line x1="36" y1="38" x2="42" y2="34" stroke="rgba(160,220,255,0.5)" stroke-width="1"/>
      <circle cx="30" cy="34" r="1.5" fill="rgba(120,220,255,0.8)"/>
      <circle cx="36" cy="30" r="1.5" fill="rgba(160,180,255,0.8)"/>
      <circle cx="42" cy="34" r="1.5" fill="rgba(120,220,255,0.8)"/>
      <circle cx="36" cy="38" r="1.5" fill="rgba(200,140,255,0.8)"/>
      <line x1="24" y1="36" x2="48" y2="36" stroke="rgba(80,220,200,0.4)" stroke-width="1" stroke-dasharray="3 3"/>
      <path d="M10 18 L10 10 L18 10" stroke="rgba(80,180,255,0.4)" stroke-width="1.5" fill="none"/>
      <path d="M54 10 L62 10 L62 18" stroke="rgba(80,180,255,0.4)" stroke-width="1.5" fill="none"/>
      <path d="M10 54 L10 62 L18 62" stroke="rgba(80,180,255,0.4)" stroke-width="1.5" fill="none"/>
      <path d="M62 54 L62 62 L54 62" stroke="rgba(80,180,255,0.4)" stroke-width="1.5" fill="none"/>
    </svg>
    <span class="upload-label">Click to load a scan</span>
    <span class="upload-sub">NIfTI · DICOM · MGH · MHD</span>
    <input type="file" id="fileInput" accept=".nii,.nii.gz,.dcm,.mgh,.mhd,.nhdr,.nrrd" />
  </div>
</div>

<!-- Viewer view -->
<div id="viewer-view">
  <div id="viewer-topbar">
    <span id="viewer-filename">—</span>
    <div class="pipeline-steps">
      <div class="step" id="step-render"><div class="step-dot"></div>Render</div>
      <div class="step" id="step-segment"><div class="step-dot"></div>Segment</div>
      <div class="step" id="step-analyze"><div class="step-dot"></div>Analyze</div>
    </div>
    <button id="new-scan-btn">+ New scan</button>
  </div>
  <div id="viewer-body">
    <div id="scan-panel">
      <canvas id="niivue-canvas"></canvas>
    </div>
    <div id="analysis-panel">
      <div id="analysis-header">AI Analysis</div>
      <div id="analysis-content">
        <div id="analysis-placeholder">Awaiting scan...</div>
        <div id="analysis-text"></div>
      </div>
    </div>
  </div>
</div>

<!-- Loading overlay -->
<div id="loading">
  <div class="spinner"></div>
  <span class="loading-text" id="loading-text">Loading scan...</span>
</div>

<script type="module">
  import { Niivue } from '/niivue/index.js';

  // ── Background animation ─────────────────────────────────────────────────
  const bgCanvas = document.getElementById('bg');
  const ctx = bgCanvas.getContext('2d');
  let W, H, nodes;
  const NODE_COUNT = 90, LINK_DIST = 160;
  const COLORS = [[80,180,255],[120,140,255],[160,90,255],[80,220,200],[200,120,255]];

  function resize() { W = bgCanvas.width = window.innerWidth; H = bgCanvas.height = window.innerHeight; }
  function randColor() { return COLORS[Math.floor(Math.random() * COLORS.length)]; }
  function initNodes() {
    nodes = Array.from({ length: NODE_COUNT }, () => ({
      x: Math.random()*W, y: Math.random()*H,
      vx: (Math.random()-0.5)*0.4, vy: (Math.random()-0.5)*0.4,
      r: Math.random()*2+1.2, col: randColor(), pulse: 0,
    }));
  }
  setInterval(() => { if (nodes) nodes[Math.floor(Math.random()*nodes.length)].pulse = 1.0; }, 600);

  function drawBg() {
    ctx.clearRect(0,0,W,H);
    const gr = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.65);
    gr.addColorStop(0,'rgba(30,20,80,0.35)'); gr.addColorStop(1,'rgba(6,6,16,0)');
    ctx.fillStyle = gr; ctx.fillRect(0,0,W,H);
    for (let i=0;i<nodes.length;i++) for (let j=i+1;j<nodes.length;j++) {
      const a=nodes[i],b=nodes[j],dx=a.x-b.x,dy=a.y-b.y,dist=Math.sqrt(dx*dx+dy*dy);
      if (dist>LINK_DIST) continue;
      const t=1-dist/LINK_DIST,pulse=Math.max(a.pulse,b.pulse),alpha=t*(0.12+pulse*0.4);
      const [r,g,bl]=a.col;
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
      ctx.strokeStyle=`rgba(${r},${g},${bl},${alpha.toFixed(3)})`; ctx.lineWidth=t*(0.6+pulse*1.2); ctx.stroke();
    }
    for (const n of nodes) {
      const [r,g,b]=n.col;
      const glow=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r*(4+n.pulse*6));
      glow.addColorStop(0,`rgba(${r},${g},${b},${0.9+n.pulse*0.1})`);
      glow.addColorStop(0.4,`rgba(${r},${g},${b},${0.2+n.pulse*0.3})`);
      glow.addColorStop(1,`rgba(${r},${g},${b},0)`);
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r*(1+n.pulse*1.5),0,Math.PI*2);
      ctx.fillStyle=glow; ctx.fill();
      n.x+=n.vx; n.y+=n.vy;
      if(n.x<0||n.x>W) n.vx*=-1; if(n.y<0||n.y>H) n.vy*=-1;
      n.pulse=Math.max(0,n.pulse-0.018);
    }
    requestAnimationFrame(drawBg);
  }
  resize(); initNodes(); drawBg();
  window.addEventListener('resize', () => { resize(); initNodes(); });

  // ── NiiVue ───────────────────────────────────────────────────────────────
  const nv = new Niivue({ backColor: [0.02, 0.02, 0.08, 1], show3Dcrosshair: true });
  nv.attachToCanvas(document.getElementById('niivue-canvas'));

  // ── Elements ─────────────────────────────────────────────────────────────
  const uploadView      = document.getElementById('upload-view');
  const viewerView      = document.getElementById('viewer-view');
  const loadingEl       = document.getElementById('loading');
  const loadingText     = document.getElementById('loading-text');
  const box             = document.getElementById('uploadBox');
  const fileInput       = document.getElementById('fileInput');
  const filenameEl      = document.getElementById('viewer-filename');
  const newScanBtn      = document.getElementById('new-scan-btn');
  const analysisText    = document.getElementById('analysis-text');
  const analysisHolder  = document.getElementById('analysis-placeholder');
  const steps           = { render: document.getElementById('step-render'), segment: document.getElementById('step-segment'), analyze: document.getElementById('step-analyze') };

  function setStep(name, state) {
    const el = steps[name];
    el.className = `step ${state}`;
  }

  function showLoading(msg) { loadingText.textContent = msg; loadingEl.classList.add('active'); }
  function hideLoading()    { loadingEl.classList.remove('active'); }

  // ── Upload handlers ──────────────────────────────────────────────────────
  box.addEventListener('click', () => fileInput.click());
  box.addEventListener('dragover', e => { e.preventDefault(); box.classList.add('drag-over'); });
  box.addEventListener('dragleave', () => box.classList.remove('drag-over'));
  box.addEventListener('drop', e => { e.preventDefault(); box.classList.remove('drag-over'); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
  fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });

  async function handleFile(file) {
    // Reset state
    Object.keys(steps).forEach(k => setStep(k, ''));
    analysisText.style.display = 'none';
    analysisText.innerHTML = '';
    analysisHolder.textContent = 'Awaiting scan...';
    analysisHolder.style.display = 'flex';

    // ── Step 1: render in NiiVue ──
    showLoading('Rendering scan...');
    setStep('render', 'active');
    try {
      const url = URL.createObjectURL(file);
      await nv.loadVolumes([{ url, name: file.name }]);
      filenameEl.textContent = file.name;
      uploadView.style.display = 'none';
      viewerView.classList.add('active');
      setStep('render', 'done');
    } catch (err) {
      setStep('render', 'error');
      hideLoading();
      alert('Could not render scan.');
      return;
    }

    // ── Step 2: segment ──
    showLoading('Running segmentation... (this may take a minute)');
    setStep('segment', 'active');
    analysisHolder.textContent = 'Segmenting scan...';

    let scanId;
    try {
      const formData = new FormData();
      formData.append('file', file);
      const res = await fetch('/api/segment', { method: 'POST', body: formData });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      scanId = data.scan_id ?? data.id ?? data;
      setStep('segment', 'done');
    } catch (err) {
      setStep('segment', 'error');
      hideLoading();
      analysisHolder.textContent = 'Segmentation failed.';
      console.error(err);
      return;
    }

    // ── Step 3: get structures + analyze with K2 ──
    showLoading('Analyzing with K2...');
    setStep('analyze', 'active');
    analysisHolder.textContent = 'Analyzing structures...';

    try {
      const structRes = await fetch(`/api/structures/${scanId}`);
      if (!structRes.ok) throw new Error('Failed to get structures');
      const structures = await structRes.json();

      analysisHolder.style.display = 'none';
      analysisText.style.display = 'block';
      hideLoading();

      // Stream K2 response
      const analyzeRes = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ medicalAnalysis: JSON.stringify(structures, null, 2) }),
      });

      const reader = analyzeRes.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value);
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const payload = line.slice(6).trim();
          if (payload === '[DONE]') continue;
          try {
            const chunk = JSON.parse(payload);
            const token = chunk.choices?.[0]?.delta?.content ?? '';
            if (token) appendToken(token);
          } catch {}
        }
      }

      setStep('analyze', 'done');
    } catch (err) {
      setStep('analyze', 'error');
      hideLoading();
      console.error(err);
    }
  }

  function appendToken(token) {
    // Highlight section titles
    const formatted = token.replace(/(SUMMARY|WHAT WE FOUND|WHAT THIS MIGHT MEAN|NEXT STEPS)/g,
      '<span class="section-title">$1</span>');
    if (formatted !== token) {
      analysisText.innerHTML += formatted;
    } else {
      analysisText.appendChild(document.createTextNode(token));
    }
    const content = document.getElementById('analysis-content');
    content.scrollTop = content.scrollHeight;
  }

  newScanBtn.addEventListener('click', () => {
    viewerView.classList.remove('active');
    uploadView.style.display = 'flex';
    fileInput.value = '';
    nv.volumes = [];
    Object.keys(steps).forEach(k => setStep(k, ''));
  });
</script>
</body>
</html>
