<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MedLens - AI Medical Scan Explorer</title>
  <script type="module">
    import { Niivue } from "https://esm.sh/@niivue/niivue@0.68.2";
    window.Niivue = Niivue;
    window._niivueReady = true;
    console.log('NiiVue loaded');
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #060610;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e0e8ff;
    }

    /* Upload screen */
    #upload-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    #upload-screen.hidden { display: none; }

    .upload-box {
      width: 520px;
      height: 380px;
      background: rgba(10, 12, 40, 0.55);
      backdrop-filter: blur(18px);
      border-radius: 24px;
      border: 1.5px solid rgba(80, 180, 255, 0.25);
      box-shadow: 0 0 60px rgba(50, 130, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      cursor: pointer;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .upload-box:hover {
      border-color: rgba(100, 200, 255, 0.55);
      box-shadow: 0 0 80px rgba(50, 130, 255, 0.18);
    }

    .upload-box.processing {
      pointer-events: none;
      border-color: rgba(80, 255, 180, 0.5);
    }

    .upload-label { font-size: 1.15rem; color: rgba(180, 220, 255, 0.9); }
    .upload-sub { font-size: 0.8rem; color: rgba(120, 160, 220, 0.55); }
    .upload-status { font-size: 0.9rem; color: rgba(80, 255, 180, 0.9); display: none; }
    .upload-box.processing .upload-status { display: block; }
    .upload-box.processing .upload-label,
    .upload-box.processing .upload-sub { display: none; }
    input[type="file"] { display: none; }

    /* Main viewer */
    #viewer-screen { display: none; height: 100vh; }
    #viewer-screen.active { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr auto; }

    #niivue-panel {
      background: #0a0a1a;
      border-right: 1px solid rgba(80, 180, 255, 0.15);
      position: relative;
    }

    #niivue-panel canvas { width: 100% !important; height: 100% !important; }

    #threejs-panel {
      background: #080818;
      position: relative;
      overflow: hidden;
    }

    #info-panel {
      grid-column: 1 / -1;
      background: rgba(10, 12, 40, 0.9);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(80, 180, 255, 0.15);
      padding: 16px 24px;
      max-height: 300px;
      overflow-y: auto;
      display: flex;
      gap: 24px;
    }

    #structures-list {
      flex: 1;
      min-width: 200px;
    }

    #structures-list h3 { font-size: 0.85rem; color: rgba(120, 180, 255, 0.8); margin-bottom: 8px; }

    .structure-item {
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      transition: background 0.2s;
    }

    .structure-item:hover { background: rgba(80, 180, 255, 0.1); }
    .structure-item.selected { background: rgba(80, 180, 255, 0.2); border: 1px solid rgba(80, 180, 255, 0.4); }
    .structure-vol { color: rgba(120, 160, 220, 0.6); }

    #analysis-panel {
      flex: 2;
      font-size: 0.85rem;
      line-height: 1.6;
    }

    #analysis-panel h3 { font-size: 0.85rem; color: rgba(120, 180, 255, 0.8); margin-bottom: 8px; }
    #analysis-text { white-space: pre-wrap; color: rgba(200, 220, 255, 0.85); }
    #analysis-text.loading { color: rgba(80, 255, 180, 0.7); }

    .panel-label {
      position: absolute;
      top: 8px;
      left: 12px;
      font-size: 0.7rem;
      color: rgba(120, 160, 220, 0.5);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      z-index: 10;
    }

    #analyze-btn {
      padding: 8px 20px;
      background: rgba(80, 180, 255, 0.15);
      border: 1px solid rgba(80, 180, 255, 0.3);
      color: rgba(180, 220, 255, 0.9);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
      margin-top: 8px;
    }

    #analyze-btn:hover { background: rgba(80, 180, 255, 0.25); }
    #analyze-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .loading { animation: pulse 1.5s ease-in-out infinite; }
  </style>
</head>
<body>

<!-- Upload Screen -->
<div id="upload-screen">
  <div class="upload-box" id="uploadBox">
    <svg width="72" height="72" viewBox="0 0 72 72" fill="none">
      <circle cx="36" cy="36" r="32" stroke="rgba(80,180,255,0.5)" stroke-width="1.5"/>
      <path d="M24 34c0-6.627 5.373-10 12-10s12 3.373 12 10c0 2-.5 4-1.5 5.5C48 42 48 44 46 46c-1 1-2.5 1.5-4 1l-1 3h-10l-1-3c-1.5.5-3 0-4-1-2-2-2-4-.5-6.5C24.5 38 24 36 24 34Z"
            stroke="rgba(120,200,255,0.85)" stroke-width="1.5" fill="rgba(80,140,255,0.08)"/>
    </svg>
    <span class="upload-label">Click to upload a brain scan</span>
    <span class="upload-sub">NIfTI (.nii, .nii.gz)</span>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button id="modeBrain" onclick="event.stopPropagation();setMode('brain')" style="padding:6px 14px;background:rgba(80,180,255,0.3);border:1px solid rgba(80,180,255,0.5);color:rgba(180,220,255,0.9);border-radius:6px;cursor:pointer;font-size:0.75rem;">Brain</button>
      <button id="modeTorso" onclick="event.stopPropagation();setMode('torso')" style="padding:6px 14px;background:rgba(80,180,255,0.08);border:1px solid rgba(80,180,255,0.2);color:rgba(120,160,220,0.6);border-radius:6px;cursor:pointer;font-size:0.75rem;">Full Body</button>
    </div>
    <span class="upload-status" id="uploadStatus">Processing scan...</span>
    <input type="file" id="fileInput" accept=".nii,.nii.gz" />
  </div>
</div>

<!-- Viewer Screen -->
<div id="viewer-screen">
  <button onclick="location.reload()" style="position:fixed;top:14px;left:14px;z-index:200;padding:7px 14px;background:rgba(10,12,40,0.85);border:1px solid rgba(80,180,255,0.35);color:rgba(180,220,255,0.9);border-radius:8px;font-size:0.78rem;cursor:pointer;backdrop-filter:blur(8px);">&#8592; New Scan</button>
  <div id="niivue-panel">
    <span class="panel-label">2D Slice Viewer</span>
    <canvas id="gl"></canvas>
  </div>
  <div id="threejs-panel">
    <span class="panel-label">3D Model</span>
    <button id="ar-view-btn" style="display:none;position:absolute;bottom:16px;right:16px;z-index:100;padding:8px 16px;background:rgba(80,180,255,0.15);border:1px solid rgba(80,180,255,0.4);color:rgba(180,220,255,0.9);border-radius:8px;font-size:0.8rem;cursor:pointer;" onclick="launchMarkerAR()">AR View</button>
  </div>
  <!-- Organ info popup -->
  <div id="organ-popup" style="display:none;position:absolute;z-index:50;width:340px;background:rgba(10,12,40,0.92);backdrop-filter:blur(14px);border:1px solid rgba(80,180,255,0.3);border-radius:14px;box-shadow:0 0 40px rgba(50,130,255,0.12);padding:16px 20px;color:#e0e8ff;font-size:0.82rem;line-height:1.6;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <span id="popup-title" style="font-size:1rem;font-weight:600;color:rgba(120,200,255,0.95);"></span>
      <button onclick="closeOrganPopup()" style="background:none;border:none;color:rgba(255,255,255,0.5);cursor:pointer;font-size:1.1rem;">x</button>
    </div>
    <div id="popup-stats" style="margin-bottom:10px;padding:8px 10px;background:rgba(80,180,255,0.06);border-radius:8px;font-size:0.78rem;"></div>
    <div id="popup-insight" style="white-space:pre-wrap;font-size:0.8rem;color:rgba(200,220,255,0.85);"></div>
  </div>
  <!-- AR overlay -->
  <div id="ar-overlay" style="display:none;position:fixed;inset:0;z-index:9999;"></div>
  <div id="info-panel">
    <div id="structures-list">
      <h3>Detected Structures</h3>
      <div id="structures-container"></div>
    </div>
    <div id="analysis-panel">
      <h3>Patient Report</h3>
      <button id="analyze-btn" onclick="runAnalysis()">Generate AI Report</button>
      <div id="analysis-text"></div>
    </div>
  </div>
</div>

<script>
  // --- Upload handling (non-module, runs immediately) ---
  const BACKEND = '/api';
  let currentScanId = null;
  let structuresData = null;
  let nv = null;
  let scanMode = 'brain';

  window.setMode = function(mode) {
    scanMode = mode;
    document.getElementById('modeBrain').style.background = mode === 'brain' ? 'rgba(80,180,255,0.3)' : 'rgba(80,180,255,0.08)';
    document.getElementById('modeBrain').style.borderColor = mode === 'brain' ? 'rgba(80,180,255,0.5)' : 'rgba(80,180,255,0.2)';
    document.getElementById('modeBrain').style.color = mode === 'brain' ? 'rgba(180,220,255,0.9)' : 'rgba(120,160,220,0.6)';
    document.getElementById('modeTorso').style.background = mode === 'torso' ? 'rgba(80,180,255,0.3)' : 'rgba(80,180,255,0.08)';
    document.getElementById('modeTorso').style.borderColor = mode === 'torso' ? 'rgba(80,180,255,0.5)' : 'rgba(80,180,255,0.2)';
    document.getElementById('modeTorso').style.color = mode === 'torso' ? 'rgba(180,220,255,0.9)' : 'rgba(120,160,220,0.6)';
  };

  const box = document.getElementById('uploadBox');
  const input = document.getElementById('fileInput');
  const statusEl = document.getElementById('uploadStatus');

  box.addEventListener('click', (e) => {
    e.stopPropagation();
    input.click();
  });
  box.addEventListener('dragover', e => { e.preventDefault(); });
  box.addEventListener('drop', e => {
    e.preventDefault();
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
  input.addEventListener('change', () => { if (input.files[0]) handleFile(input.files[0]); });
</script>

<script type="module">
  import * as THREE from 'https://esm.sh/three@0.170.0';
  import { OrbitControls } from 'https://esm.sh/three@0.170.0/addons/controls/OrbitControls.js';
  import { GLTFLoader } from 'https://esm.sh/three@0.170.0/addons/loaders/GLTFLoader.js';
  import { ARButton } from 'https://esm.sh/three@0.170.0/addons/webxr/ARButton.js';

  window.THREE = THREE;
  window.OrbitControls = OrbitControls;
  window.GLTFLoader = GLTFLoader;
  window.ARButton = ARButton;
  window._threeReady = true;
  console.log('Three.js loaded successfully');
</script>

<script>
  async function handleFile(file) {
    box.classList.add('processing');
    statusEl.textContent = 'Uploading and segmenting scan...';
    statusEl.style.display = 'block';

    const formData = new FormData();
    formData.append('file', file);

    try {
      // 1. Segment (demo mode = instant synthetic brain, real mode = TotalSegmentator)
      const segEndpoint = `${BACKEND}/segment/demo?mode=${scanMode}`;
      statusEl.textContent = scanMode === 'brain' ? 'Analyzing brain scan...' : 'Analyzing full body scan...';
      const segRes = await fetch(segEndpoint, { method: 'POST', body: formData });
      if (!segRes.ok) throw new Error(await segRes.text());
      structuresData = await segRes.json();
      currentScanId = structuresData.scan_id;

      // 2. Switch to viewer
      document.getElementById('upload-screen').classList.add('hidden');
      document.getElementById('viewer-screen').classList.add('active');

      // 3. Load NiiVue
      statusEl.textContent = 'Loading viewer...';
      try {
        await initNiiVue(currentScanId);
      } catch (e) { console.warn('NiiVue:', e.message); }

      // 4. Load 3D mesh
      try {
        await initThreeJS(currentScanId);
      } catch (e) { console.warn('3D:', e.message); }

      // 5. Populate structures list
      renderStructures(structuresData.structures);

      // 6. Show AR button
      document.getElementById('ar-view-btn').style.display = 'block';

    } catch (err) {
      statusEl.textContent = `Error: ${err.message}`;
      console.error(err);
      setTimeout(() => {
        box.classList.remove('processing');
        statusEl.style.display = 'none';
      }, 3000);
    }
  }

  // --- NiiVue ---
  async function initNiiVue(scanId) {
    const Niivue = window.Niivue;
    nv = new Niivue({
      backColor: [0.03, 0.03, 0.1, 1],
      show3Dcrosshair: false,
    });
    await nv.attachToCanvas(document.getElementById('gl'));
    await nv.loadVolumes([
      { url: `${BACKEND}/scan/${scanId}`, name: 'scan.nii.gz', colormap: 'gray' },
      { url: `${BACKEND}/segmentation/${scanId}`, name: 'seg.nii.gz', colormap: 'actc', opacity: 0.4 },
    ]);
    nv.setSliceType(nv.sliceTypeMultiplanar);
  }

  // --- Three.js + WebXR AR ---
  async function initThreeJS(scanId) {
    while (!window._threeReady) await new Promise(r => setTimeout(r, 100));
    const THREE = window.THREE;
    const OrbitControls = window.OrbitControls;
    const GLTFLoader = window.GLTFLoader;
    const ARButton = window.ARButton;

    const container = document.getElementById('threejs-panel');
    // Wait for layout to settle
    await new Promise(r => setTimeout(r, 200));
    let w = container.clientWidth;
    let h = container.clientHeight;
    if (w === 0 || h === 0) {
      await new Promise(r => setTimeout(r, 500));
      w = container.clientWidth || 600;
      h = container.clientHeight || 400;
    }
    console.log('Three.js container:', w, 'x', h);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080818);

    const camera = new THREE.PerspectiveCamera(50, w / h, 0.01, 2000);
    camera.position.set(0, 0, 300);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(w, h);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // AR setup (only on supported devices, fails gracefully on PC)
    let arSupported = false;
    try {
      if (navigator.xr) {
        arSupported = await navigator.xr.isSessionSupported('immersive-ar');
      }
    } catch (e) { /* no XR */ }

    if (arSupported) {
      renderer.xr.enabled = true;
      const arBtn = ARButton.createButton(renderer, {
        requiredFeatures: ['hit-test'],
        optionalFeatures: ['dom-overlay'],
        domOverlay: { root: document.body },
      });
      arBtn.style.cssText = 'position:absolute;bottom:16px;right:16px;z-index:100;padding:8px 16px;background:rgba(80,180,255,0.15);border:1px solid rgba(80,180,255,0.4);color:rgba(180,220,255,0.9);border-radius:8px;font-size:0.8rem;cursor:pointer;';
      container.appendChild(arBtn);
    }

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Lighting
    scene.add(new THREE.AmbientLight(0x4060ff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(100, 200, 150);
    scene.add(dirLight);
    const dirLight2 = new THREE.DirectionalLight(0x8080ff, 0.5);
    dirLight2.position.set(-100, -100, -100);
    scene.add(dirLight2);

    // AR reticle for surface placement
    const reticle = new THREE.Mesh(
      new THREE.RingGeometry(0.05, 0.08, 32).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0x4488ff, side: THREE.DoubleSide })
    );
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    let hitTestSource = null;
    let modelPlaced = false;

    renderer.xr.addEventListener('sessionstart', async () => {
      scene.background = null;
      controls.enabled = false;
      const session = renderer.xr.getSession();
      const viewerSpace = await session.requestReferenceSpace('viewer');
      hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
      session.addEventListener('select', () => {
        if (reticle.visible && window._medlensModel) {
          window._medlensModel.position.setFromMatrixPosition(reticle.matrix);
          window._medlensModel.visible = true;
          modelPlaced = true;
          reticle.visible = false;
        }
      });
    });

    renderer.xr.addEventListener('sessionend', () => {
      scene.background = new THREE.Color(0x080818);
      controls.enabled = true;
      hitTestSource = null;
      modelPlaced = false;
      reticle.visible = false;
      if (window._medlensModel) window._medlensModel.visible = true;
    });

    // Load GLB
    const loader = new GLTFLoader();
    console.log('Loading GLB from:', `${BACKEND}/mesh/${scanId}`);
    try {
      const gltf = await new Promise((resolve, reject) => {
        loader.load(`${BACKEND}/mesh/${scanId}`, resolve,
          (progress) => { if (progress.total) console.log('GLB progress:', Math.round(progress.loaded/progress.total*100) + '%'); },
          reject);
      });
      console.log('GLB loaded, scene children:', gltf.scene.children.length);

      const model = gltf.scene;
      const box3 = new THREE.Box3().setFromObject(model);
      const center = box3.getCenter(new THREE.Vector3());
      model.position.sub(center);

      const size = box3.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      if (maxDim > 0) model.scale.multiplyScalar(200 / maxDim);

      model.traverse(child => {
        if (child.isMesh) {
          child.material.transparent = true;
          child.material.opacity = 0.7;
          child.material.side = THREE.DoubleSide;
        }
      });

      scene.add(model);
      window._medlensModel = model;

      camera.position.set(0, 0, 300);
      controls.target.set(0, 0, 0);
      controls.update();
    } catch (err) {
      console.error('Failed to load 3D model:', err);
    }

    // Raycasting for structure selection + popup
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    renderer.domElement.addEventListener('click', e => {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      if (!window._medlensModel) return;
      const hits = raycaster.intersectObjects(window._medlensModel.children, true);
      if (hits.length > 0) {
        const name = hits[0].object.name;
        if (name) {
          document.querySelectorAll('.structure-item').forEach(el => el.classList.remove('selected'));
          document.querySelectorAll('.structure-item').forEach(el => {
            if (el.querySelector('span')?.textContent === name.replace(/_/g, ' ')) el.classList.add('selected');
          });
          highlightStructure(name);
          showOrganPopup(name, e.clientX, e.clientY);
        }
      }
    });

    // XR-compatible animation loop
    renderer.setAnimationLoop((timestamp, frame) => {
      if (frame && hitTestSource && !modelPlaced) {
        const refSpace = renderer.xr.getReferenceSpace();
        const hits = frame.getHitTestResults(hitTestSource);
        if (hits.length > 0) {
          reticle.visible = true;
          reticle.matrix.fromArray(hits[0].getPose(refSpace).transform.matrix);
        } else {
          reticle.visible = false;
        }
      }
      controls.update();
      renderer.render(scene, camera);
    });

    window.addEventListener('resize', () => {
      const w2 = container.clientWidth, h2 = container.clientHeight;
      camera.aspect = w2 / h2;
      camera.updateProjectionMatrix();
      renderer.setSize(w2, h2);
    });
  }

  // --- Structures list ---
  function renderStructures(structures) {
    const container = document.getElementById('structures-container');
    container.innerHTML = '';
    for (const s of structures) {
      const div = document.createElement('div');
      div.className = 'structure-item';
      const displayName = s.name.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      div.innerHTML = `<span>${displayName}</span><span class="structure-vol">${s.volume_ml} mL</span>`;
      div.addEventListener('click', (e) => {
        console.log('[CLICK] Structure list item clicked:', s.name);
        document.querySelectorAll('.structure-item').forEach(el => el.classList.remove('selected'));
        div.classList.add('selected');
        highlightStructure(s.name);
        showOrganPopup(s.name, e.clientX, e.clientY);
      });
      container.appendChild(div);
    }
  }

  function highlightStructure(name) {
    if (!window._medlensModel || !window.THREE) return;
    const THREE = window.THREE;
    window._medlensModel.traverse(child => {
      if (child.isMesh) {
        if (child.name === name) {
          child.material.opacity = 1.0;
          child.material.emissive = new THREE.Color(0x3388ff);
          child.material.emissiveIntensity = 0.3;
        } else {
          child.material.opacity = 0.3;
          child.material.emissive = new THREE.Color(0x000000);
          child.material.emissiveIntensity = 0;
        }
      }
    });
  }

  // --- Organ popup ---
  async function showOrganPopup(structureName, mouseX, mouseY) {
    console.log('[POPUP] showOrganPopup called:', structureName, mouseX, mouseY);
    const popup = document.getElementById('organ-popup');
    const title = document.getElementById('popup-title');
    const stats = document.getElementById('popup-stats');
    const insight = document.getElementById('popup-insight');

    // Find structure data - try exact match first, then fuzzy match by keywords
    let s = structuresData?.structures?.find(st => st.name === structureName);
    if (!s) {
      const lower = structureName.toLowerCase();
      s = structuresData?.structures?.find(st => {
        const n = st.name.toLowerCase();
        return lower.includes(n) || n.includes(lower) ||
          (lower.includes('frontal') && n === 'frontal_lobe') ||
          (lower.includes('parietal') && n === 'parietal_lobe') ||
          (lower.includes('temporal') && n === 'temporal_lobe') ||
          (lower.includes('occipital') && n === 'occipital_lobe') ||
          (lower.includes('cerebellum') && n === 'cerebellum') ||
          (lower.includes('brain') && n === 'brain');
      });
    }
    console.log('[POPUP] Structure match:', s ? s.name : 'none', 'for', structureName);
    const displayName = structureName.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

    title.textContent = displayName;

    if (s) {
      let statsHtml = '<b>Volume:</b> ' + s.volume_ml + ' mL &nbsp; <b>Voxels:</b> ' + s.voxel_count.toLocaleString();
      if (s.normal_range_ml) statsHtml += ' &nbsp; <b>Normal:</b> ' + s.normal_range_ml + ' mL';
      stats.innerHTML = statsHtml;
    } else {

  // --- K2 Analysis ---
  window.runAnalysis = async function() {
    if (!structuresData) return;
    const btn = document.getElementById('analyze-btn');
    const textDiv = document.getElementById('analysis-text');
    btn.disabled = true;
    textDiv.className = 'loading';
    textDiv.textContent = 'Generating patient-friendly report...';

    const medicalSummary = structuresData.structures.map(s =>
      `Structure: ${s.name}, Volume: ${s.volume_ml} mL, Voxels: ${s.voxel_count}`
    ).join('\n');

    try {
      const res = await fetch('/api/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ medicalAnalysis: medicalSummary }),
      });

      textDiv.className = '';
      textDiv.textContent = '';

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value);

        // Parse SSE data chunks
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          if (line.startsWith('data: ')) {
            const data = line.slice(6);
            if (data === '[DONE]') continue;
            try {
              const parsed = JSON.parse(data);
              let content = parsed.choices?.[0]?.delta?.content || '';
              // Filter out <think> reasoning blocks from K2
              if (content.includes('<think>')) window._inThink = true;
              if (window._inThink) {
                if (content.includes('</think>')) {
                  content = content.split('</think>').pop();
                  window._inThink = false;
                } else {
                  content = '';
                }
              }
              if (content) textDiv.textContent += content;
            } catch {}
          }
        }
      }
    } catch (err) {
      textDiv.className = '';
      textDiv.textContent = `Error generating report: ${err.message}`;
    }
    btn.disabled = false;
  };

    (async () => {

        await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.min.js');

          'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/' + file
        });

        hands.setOptions({
          maxNumHands: 2,
          modelComplexity: 0,

        });

        let prevPinchDist = null;
        let prevPalmX = null;
        let prevPalmY = null;
        let activeGesture = null; // 'scale' | 'rotate' | 'point' | 'pinchzoom' | null
        const baseScale = 180 / maxDim;

        const arRaycaster = new THREE.Raycaster();
        const arPointer = new THREE.Vector2();
        let pointingAt = null;
        let pointingTimer = null;
        let selectedInAR = null;

        function dist(a, b) {
          return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
        }

        // Use PIP joints (mid-knuckle) for strong extended/curled discrimination
        // tip > pip.y = curled, tip < pip.y = extended (screen Y: 0=top, 1=bottom)
        // Landmarks: index tip=8 pip=6, middle tip=12 pip=10, ring tip=16 pip=14, pinky tip=20 pip=18

        function isPointing(lm) {
          const indexExtended = lm[6].y - lm[8].y > 0.04; // index tip well above its PIP
          const middleCurled  = lm[12].y > lm[10].y;      // middle tip below its PIP
          const ringCurled    = lm[16].y > lm[14].y;      // ring tip below its PIP
          const pinkyCurled   = lm[20].y > lm[18].y;      // pinky tip below its PIP
          return indexExtended && middleCurled && ringCurled && pinkyCurled;
        }

        function isOpenPalm(lm) {
          // All 4 fingers: tips clearly above their PIP joints
          const fingers = [[8,6],[12,10],[16,14],[20,18]];
          const fourExtended = fingers.every(([tip, pip]) => lm[pip].y - lm[tip].y > 0.04);
          // Thumb extended: tip(4) spread away from palm center (lm[9])
          const thumbExtended = dist(lm[4], lm[9]) > 0.15;
          return fourExtended && thumbExtended;
        }

        function isFist(lm) {
          // All 4 finger tips below their PIP joints
          const fingers = [[8,6],[12,10],[16,14],[20,18]];
          return fingers.every(([tip, pip]) => lm[tip].y > lm[pip].y);
        }

        function raycastFromFinger(indexTip) {
          // Map hand landmark (0-1) to screen coords, mirrored
          arPointer.x = -(indexTip.x * 2 - 1);
          arPointer.y = -(indexTip.y * 2 - 1);
          arRaycaster.setFromCamera(arPointer, arCamera);
          const hits = arRaycaster.intersectObjects(arModel.children, true);
          return hits.length > 0 ? hits[0].object.name : null;

        function highlightARStructure(name) {
          arModel.traverse(child => {
            if (child.isMesh) {

                child.material.opacity = 1.0;
                child.material.emissive = new THREE.Color(0x3388ff);
                child.material.emissiveIntensity = 0.4;
              } else {
                child.material.opacity = 0.4;
                child.material.emissive = new THREE.Color(0x000000);
                child.material.emissiveIntensity = 0;
              }
            }
          });
        }

        function resetARHighlight() {
          arModel.traverse(child => {
            if (child.isMesh) {
              child.material.opacity = 0.85;
              child.material.emissive = new THREE.Color(0x000000);
              child.material.emissiveIntensity = 0;
            }
          });
        }

        hands.onResults((results) => {
          handCanvas.width = handCanvas.clientWidth;
          handCanvas.height = handCanvas.clientHeight;
          handCtx.clearRect(0, 0, handCanvas.width, handCanvas.height);

          if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
            prevPinchDist = null;
            prevPalmX = null;
            prevPalmY = null;
            activeGesture = null;
            indicator.style.display = 'none';
            return;
          }

          // Draw hand landmarks
          for (const landmarks of results.multiHandLandmarks) {
            drawConnectors(handCtx, landmarks, HAND_CONNECTIONS, { color: 'rgba(80,180,255,0.4)', lineWidth: 2 });
            drawLandmarks(handCtx, landmarks, { color: 'rgba(80,220,255,0.6)', lineWidth: 1, radius: 3 });
          }

          // Two hands: pinch-to-zoom — always takes priority
          if (results.multiHandLandmarks.length === 2) {
            activeGesture = 'pinchzoom';
            prevPalmX = null; prevPalmY = null;
            const idx1 = results.multiHandLandmarks[0][8];
            const idx2 = results.multiHandLandmarks[1][8];
            const pinchDist = dist(idx1, idx2);
            if (prevPinchDist !== null) {
              const delta = pinchDist - prevPinchDist;
              arScale = Math.max(0.1, Math.min(5, arScale + delta * 1.2));
              arModel.scale.setScalar(arScale * baseScale);
              indicator.style.display = 'block';
              indicator.textContent = 'Pinch zoom: ' + arScale.toFixed(2) + 'x';
            }
            prevPinchDist = pinchDist;
            return;
          }

          prevPinchDist = null;
          const lm = results.multiHandLandmarks[0];
          const index = lm[8];

          // Re-evaluate gesture every frame — no locking, releases immediately when gesture stops
          activeGesture = isPointing(lm) ? 'point' : isOpenPalm(lm) ? 'scale' : isFist(lm) ? 'rotate' : null;
          if (!activeGesture) { prevPalmX = null; prevPalmY = null; indicator.style.display = 'none'; return; }

          // --- POINT ---
          if (activeGesture === 'point') {
            const hitName = raycastFromFinger(index);
            const dotX = (1 - index.x) * handCanvas.width;
            const dotY = index.y * handCanvas.height;
            handCtx.beginPath();
            handCtx.arc(dotX, dotY, 12, 0, Math.PI * 2);
            handCtx.fillStyle = hitName ? 'rgba(80,255,180,0.7)' : 'rgba(255,180,80,0.5)';
            handCtx.fill();
            handCtx.strokeStyle = 'white'; handCtx.lineWidth = 2; handCtx.stroke();
            if (hitName) {
              highlightARStructure(hitName);
              indicator.style.display = 'block';
              indicator.textContent = 'Pointing at: ' + hitName.replace(/_/g, ' ');
              if (pointingAt === hitName) {
                if (!pointingTimer) {
                  pointingTimer = setTimeout(() => {
                    selectedInAR = hitName;
                    indicator.textContent = 'Selected: ' + hitName.replace(/_/g, ' ');
                    showOrganPopup(hitName, window.innerWidth / 2 - 170, 80);
                    pointingTimer = null;
                  }, 800);
                }
              } else {
                clearTimeout(pointingTimer); pointingTimer = null; pointingAt = hitName;
              }
            } else {
              resetARHighlight();
              clearTimeout(pointingTimer); pointingTimer = null; pointingAt = null;
              indicator.style.display = 'block';
              indicator.textContent = '☝️ Pointing...';
            }
            prevPalmX = null; prevPalmY = null;

          // --- SCALE ---
          } else if (activeGesture === 'scale') {
            if (pointingTimer) { clearTimeout(pointingTimer); pointingTimer = null; }
            pointingAt = null;
            if (selectedInAR) { resetARHighlight(); selectedInAR = null; }
            if (prevPalmY !== null) {
              const dy = prevPalmY - lm[9].y;
              arScale = Math.max(0.1, Math.min(5, arScale + dy * 2));
              arModel.scale.setScalar(arScale * baseScale);
              indicator.style.display = 'block';
              indicator.textContent = '✋ Scale: ' + arScale.toFixed(2) + 'x';
            }
            prevPalmY = lm[9].y;
            prevPalmX = null;

          // --- ROTATE ---
          } else if (activeGesture === 'rotate') {
            if (pointingTimer) { clearTimeout(pointingTimer); pointingTimer = null; }
            pointingAt = null;
            if (selectedInAR) { resetARHighlight(); selectedInAR = null; }
            if (prevPalmX !== null) {
              const dx = (lm[9].x - prevPalmX) * 3;
              pivot.rotation.y += dx;
              indicator.style.display = 'block';
              indicator.textContent = '✊ Rotating';
            }
            prevPalmX = lm[9].x;
            prevPalmY = null;
          }
        });

        // Feed webcam frames to MediaPipe
        const mpCamera = new Camera(video, {
          onFrame: async () => {
            if (overlay.style.display === 'none') return;
            await hands.send({ image: video });
          },
          width: 640,
          height: 480,
        });
        mpCamera.start();
        window._mpCamera = mpCamera;

      } catch (err) {
        console.warn('Hand tracking unavailable:', err.message);
      }
    })();
  };

  window.closeMarkerAR = function() {
    const overlay = document.getElementById('ar-overlay');
    if (window._arRAF) cancelAnimationFrame(window._arRAF);
    const video = document.getElementById('ar-video');
    if (video && video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
    overlay.style.display = 'none';
    overlay.innerHTML = '';
    if (window._arScaleHandler) window.removeEventListener('keydown', window._arScaleHandler);
    if (window._arResizeHandler) window.removeEventListener('resize', window._arResizeHandler);
    if (window._mpCamera) { try { window._mpCamera.stop(); } catch(e) {} }
  };
</script>
</body>
</html>
